name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/documentation.yaml'
      - 'docs/**'
      - 'src/ephysatlas/**'
  # Build (but do not deploy) on PRs so doc breakage is caught before merge.
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/documentation.yaml'
      - 'docs/**'
      - 'src/ephysatlas/**'

# Least-privilege permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages runs; do not cancel an in-progress deployment (GitHub's
# recommended setting once PR builds share this workflow).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Quarto is a standalone binary, not a Python package.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      # Lite install + the `docs` group (quartodoc, griffe). The `full` extra is not
      # needed: quartodoc reads docstrings statically, and the optional NWB/Zarr/DARTsort
      # dependencies are lazily imported, so their symbols still document from a lite
      # install.
      - name: Sync docs dependencies
        run: uv sync --group docs

      # Generates docs/api/ from the docstrings, per the `quartodoc` block in
      # docs/_quarto.yml. Must run before `quarto render`, which expects those pages.
      - name: Build API reference
        run: uv run quartodoc build --config docs/_quarto.yml

      - name: Render site
        run: quarto render docs/

      # Only publish an artifact for real deployments, not for PR build-checks.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site/

  deploy:
    needs: build
    # PRs build for validation only; deployment happens on main / manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
