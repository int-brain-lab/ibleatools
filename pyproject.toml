[project]
name = "ibleatools"
description = "Tools for IBL data analysis and processing"
authors = [
    {name = "International Brain Laboratory", email = "software-devs@internationalbrainlab.org"},
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Neuroscience :: Data analysis",
    "Programming Language :: Python :: 3.10",
]
dynamic = ["version"]
# Lite by default: data download (S3), model download + region inference, lf/csd/ap
# feature computation, aggregation/denoising, and the torch-based spatial encoder.
# No git dependencies — the git/spike-sorting deps (dartsort, dredge, iblscripts) live
# in the optional [full] extra below. (spikeinterface is still pulled in transitively
# by ibl-neuropixel, which is fine; the dartsort spike path is the part gated by [full].)
dependencies = [
    "ibllib>=3.3.1",          # brainbox, ibllib.pipes, ONE-api (one.api/one.remote.aws), iblutil
    "ibl-neuropixel>=1.12.0", # ibldsp, neuropixel, spikeglx
    "lfpack>=0.2.0",          # data.py read_lfp_features() lazy import (LFPackReader)
    "iblatlas",               # iblatlas.atlas/regions/genomics
    "xgboost>=3.0.1",         # regionclassifier (top-level import)
    "specparam==2.0.0rc3",    # features.lf() lazy import
    "scikit-image",           # features.py top-level (skimage.restoration)
    "scikit-learn<1.9",       # 1.9.0 broke OneToOneFeatureMixin.get_feature_names_out (NotFittedError in EphysTransformer); 1.6-1.8 OK
    "filelock",               # feature_computation.py, feature_calculators/base.py
    "pyyaml",                 # data.py, regionclassifier.py
    "pandera>=0.24.0",
    "pydantic>=2.11.4",
    "joblib>=1.5",            # relaxed from ==1.5.1 to reduce resolver conflicts
    "torch",                  # spatial_encoder
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
# Explicit alias so `pip install ibleatools[lite]` (e.g. the GUI dependency line) is
# valid. Adds nothing — the base install is already the lite set.
lite = []
# Full install: the base (lite) plus the spike/waveform-computation stack AND the
# SDSC supercomputing-pipeline deps (luigi, iblscripts).
full = [
    "dartsort @ git+https://github.com/cwindolf/dartsort@iblsorter",
    "dredge @ git+https://github.com/evarol/dredge@v0.2.2",
    "spikeinterface>=0.101.2",
    "hdbscan>=0.8.40",
    "h5py==3.15.1", #Some dartsort error arises in the unit tests, if I don't fix this.
    "linear-operator>=0.6",
    "opt-einsum>=3.4.0",
    "luigi>=3.6.0",
    "iblscripts @ git+https://github.com/int-brain-lab/iblscripts.git",
    # NWB feature calculator (feature_calculators/nwb.py): read local/streamed/DANDI
    # NWB recordings through SpikeInterface. Lazy-imported, so lite install is unaffected.
    "pynwb",
    "hdmf-zarr",
    "remfile",
    "fsspec",
    "aiohttp",
    "dandi",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  ".pdm-build",
  ".vscode",
  "scratch",
  "*.parquet",
  "examples"
]

[tool.ruff.lint]
select = ["E", "F"]  # pycodestyle, Pyflakes, bugbear, pyupgrade
ignore = ["E501"]               # Ignore line-too-long

# Example of per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]     # Ignore unused imports in __init__.py
"tests/*" = ["S101"]          # Ignore assert statements in tests


[tool.pdm]
distribution = true

[tool.pdm.version]
source = "file"
path = 'src/ephysatlas/__init__.py'

[tool.pdm.package-dir]
ephysatlas = "src/ephysatlas"

[tool.pdm.packages]
include = ["src/ephysatlas"]

[dependency-groups]
docs = [
    "myst-parser>=4.0.1",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-rtd-theme>=3.1.0",
]
lint = ["ruff>=0.7.3"]
test = [
    "coverage",       # CI runs `uv run coverage ...` directly (declare it explicitly)
    "pytest-cov>=4.0.0",
    "coveralls",
]

[tool.coverage.run]
source = ["src/ephysatlas"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "*/.env/*",
    "*/build/*",
    "*/dist/*",
    "*/.pytest_cache/*",
    "*/.coverage*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"
